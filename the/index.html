<!DOCTYPE html>

<head>

<title>Bấm huyệt Thanh Tùng</title>
<style>
  :root { --xanh:#1F5C4A; --xanh2:#2E7D5B; --xanh-nhat:#E6F2EB; --do:#B23A2E; --vang:#E9A93B; --chu:#1D2420; --phu:#5B665F; --nen:#F6F4EE; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,"Roboto",sans-serif; font-size:18px; line-height:1.5; color:var(--chu); background:var(--nen); padding-bottom:84px; }
  a { color:inherit; }
  .an { display:none !important; }
  .nut:focus-visible, .o:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, .the:focus-visible, .quaylai:focus-visible { outline:3px solid var(--vang); outline-offset:2px; }

  /* Đầu trang */
  .dau { background:var(--xanh); color:#fff; padding:18px 16px 22px; }
  .dau .chao { font-size:15px; opacity:.85; margin:0; }
  .dau h1 { margin:2px 0 12px; font-size:24px; line-height:1.25; }
  #trangthai { display:inline-block; padding:5px 12px; border-radius:20px; background:rgba(255,255,255,.16); font-weight:700; font-size:15px; }
  #trangthai::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:#7BE0A4; margin-right:7px; vertical-align:1px; }
  #trangthai.dong::before { background:#F08A7E; }

  main { max-width:640px; margin:0 auto; }
  .khoi { padding:18px 16px 4px; }
  .khoi h2 { margin:0 0 12px; font-size:20px; }

  /* Lưới dịch vụ */
  .luoi { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .o { display:flex; flex-direction:column; align-items:center; gap:6px; background:#fff; border-radius:16px; padding:10px 6px 12px; text-decoration:none; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .o .hinh { width:100%; aspect-ratio:4/3; border-radius:12px; background:var(--xanh-nhat); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .o .hinh svg { width:92%; height:auto; }
  .o span { font-size:15px; font-weight:700; line-height:1.3; }
  .o small { font-size:14px; color:var(--do); font-weight:700; }

  /* Tiện ích nhanh */
  .tienich { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .tienich .o { background:transparent; box-shadow:none; padding:4px 2px; }
  .tienich .tron { width:58px; height:58px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .tienich .tron svg { width:30px; height:30px; }
  .tienich span { font-size:14px; font-weight:600; }

  /* Khuyến mãi */
  .km { display:block; text-decoration:none; background:linear-gradient(120deg,#B23A2E,#D2643A); color:#fff; border-radius:18px; padding:18px; position:relative; overflow:hidden; }
  .km b { display:block; font-size:20px; line-height:1.3; margin-bottom:6px; max-width:78%; }
  .km p { margin:0; font-size:16px; opacity:.95; max-width:78%; }
  .km .nho { display:inline-block; margin-top:12px; background:#fff; color:var(--do); font-weight:700; padding:8px 16px; border-radius:20px; font-size:16px; }
  .km svg { position:absolute; right:-6px; bottom:-6px; width:110px; opacity:.9; }

  /* Trang chi tiết */
  .thanh-tren { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; background:var(--xanh); color:#fff; padding:10px 12px; }
  .quaylai { background:rgba(255,255,255,.15); border:0; color:#fff; font:inherit; font-weight:700; border-radius:22px; padding:9px 16px; min-height:44px; cursor:pointer; }
  .thanh-tren h1 { font-size:19px; margin:0; line-height:1.3; }
  .hero { background:var(--xanh-nhat); display:flex; justify-content:center; padding:16px; }
  .hero svg { width:100%; max-width:420px; height:auto; }
  .gia-lon { display:flex; justify-content:space-between; align-items:center; gap:12px; background:#fff; margin:-14px 16px 0; position:relative; border-radius:16px; padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .gia-lon b { font-size:24px; color:var(--do); }
  .the { background:#fff; border-radius:16px; padding:16px; margin:14px 16px 0; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .the h2 { font-size:19px; margin:0 0 10px; color:var(--xanh); }
  .the p { margin:0 0 8px; }
  .the p:last-child { margin-bottom:0; }
  ul.loi { margin:0; padding:0; list-style:none; }
  ul.loi li { position:relative; padding:7px 0 7px 30px; }
  ul.loi li::before { content:""; position:absolute; left:4px; top:15px; width:14px; height:8px; border-left:3px solid var(--xanh2); border-bottom:3px solid var(--xanh2); transform:rotate(-45deg); }
  ol.buoc { margin:0; padding-left:24px; }
  ol.buoc li { padding:4px 0; }
  .canhbao { background:#FFF6E5; }
  .canhbao h2 { color:#8A5A00; }
  .canhbao ul.loi li::before { border:0; transform:none; width:10px; height:10px; border-radius:50%; background:#E9A93B; left:6px; top:16px; }
  .sapco ul.loi li::before { border:0; transform:none; width:10px; height:10px; border-radius:50%; background:#9BB0A4; left:6px; top:16px; }
  .phieu .tong { font-size:22px; font-weight:800; color:var(--xanh); margin:0 0 4px; }
  .thanh { height:14px; border-radius:7px; background:#E3ECE6; overflow:hidden; margin:8px 0 12px; }
  .thanh i { display:block; height:100%; background:var(--xanh2); }
  ul.buoi { list-style:none; margin:0; padding:0; }
  ul.buoi li { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid #EEE; }
  ul.buoi li:last-child { border-bottom:0; }
  ul.buoi li.trong { color:#9AA39D; }
  .ganday { margin:14px 16px 0; }

  .nut { display:block; width:100%; min-height:54px; padding:13px 16px; margin:0 0 10px; border:0; border-radius:14px; font:inherit; font-size:18px; font-weight:700; text-align:center; text-decoration:none; cursor:pointer; }
  .nut:last-child { margin-bottom:0; }
  .chinh { background:var(--xanh); color:#fff; }
  .phu { background:var(--xanh-nhat); color:var(--xanh); }
  .do { background:var(--do); color:#fff; }

  label { display:block; font-weight:700; margin:12px 0 6px; }
  input, select { width:100%; min-height:52px; padding:10px 12px; font:inherit; border:2px solid #C9D3CD; border-radius:12px; background:#fff; color:var(--chu); }
  #thongbao { margin-top:12px; padding:12px; border-radius:12px; background:var(--xanh-nhat); color:var(--xanh); font-weight:700; }
  ul.gia { list-style:none; margin:0; padding:0; }
  ul.gia li { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #EEE; }
  ul.gia li:last-child { border-bottom:0; }
  ul.gia b { color:var(--do); white-space:nowrap; }

  /* Thanh dưới */
  nav.duoi { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; background:#fff; border-top:1px solid #E3E3E3; padding:6px 4px 8px; }
  .tab { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; text-decoration:none; color:var(--phu); font-size:13px; font-weight:600; padding:4px 0; min-height:56px; }
  .tab .nhan { display:block; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.25; letter-spacing:-.1px; }
  .tab svg { width:26px; height:26px; }
  .tab[aria-current="page"] { color:var(--xanh2); }
  .qrkhung { background:#fff; border-radius:18px; padding:18px; margin:14px 16px 0; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .qrkhung .vqr { font-weight:800; color:#B23A2E; letter-spacing:.5px; margin-bottom:8px; }
  .qrkhung svg { width:100%; max-width:300px; height:auto; display:block; margin:0 auto; }
  .qrkhung .tk { margin:10px 0 0; font-size:17px; }
  .thetv { margin:14px 16px 0; border-radius:20px; padding:18px; color:#fff; background:linear-gradient(135deg,#1F5C4A,#2E7D5B 60%,#4C9A72); box-shadow:0 4px 12px rgba(31,92,74,.3); }
  .thetv .nhan { font-size:14px; opacity:.85; margin:0; }
  .thetv .ten { font-size:23px; font-weight:800; margin:2px 0 10px; }
  .thetv .ma { font-size:16px; margin:0; }
  .thetv .qrtv { background:#fff; border-radius:14px; padding:12px; margin-top:14px; display:flex; justify-content:center; }
  .thetv .qrtv svg { width:180px; height:180px; }
  .dau .chao b { font-weight:700; }
  .hd h2 { display:flex; align-items:center; gap:10px; }
  .hd .so { flex:none; width:32px; height:32px; border-radius:50%; background:var(--xanh2); color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; }
  .nutHD { display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:14px 16px; text-decoration:none; box-shadow:0 1px 3px rgba(0,0,0,.07); font-weight:700; }
  .nutHD svg { flex:none; width:34px; height:34px; }
  .nutHD small { display:block; font-weight:400; color:var(--phu); font-size:15px; }
  .o .hinh img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero.anh { padding:0; background:#000; }
  .hero.anh img { width:100%; max-width:640px; height:auto; display:block; margin:0 auto; }
  .chuong { position:absolute; top:14px; right:12px; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.16); color:#fff; text-decoration:none; border-radius:22px; padding:8px 12px; font-weight:700; font-size:15px; min-height:44px; }
  .chuong svg { width:22px; height:22px; }
  .chuong .dem { background:var(--vang); color:#1D2420; border-radius:12px; min-width:22px; height:22px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
  .dau { position:relative; }
  .dau { padding-top:66px !important; }
  .nhac { display:block; text-decoration:none; background:#FFF6E3; border-left:6px solid var(--vang); border-radius:14px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .nhac b { display:block; font-size:18px; }
  .tb { border-bottom:1px solid #EEE; padding:12px 0; }
  .tb:last-child { border-bottom:0; }
  .tb h3 { margin:0 0 4px; font-size:18px; }
  .tb .ngay { color:var(--phu); font-size:15px; margin:0 0 6px; }
  .tb .moi { display:inline-block; background:var(--do); color:#fff; font-size:13px; font-weight:700; border-radius:10px; padding:1px 8px; margin-left:6px; vertical-align:2px; }
  .tb .nutnho { display:block; margin-top:10px; }
  .hero.anh img { max-height:62vh; object-fit:cover; }
  .anhthem { width:100%; height:auto; border-radius:12px; display:block; margin-top:8px; }
  .cuon { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:6px; }
  .cuon figure { flex:0 0 78%; margin:0; scroll-snap-align:start; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .cuon img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
  .cuon figcaption { padding:8px 12px 12px; font-size:15px; color:var(--phu); line-height:1.4; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .logo-dau { display:flex; align-items:center; gap:12px; margin:0 0 12px; }
  .logo-dau img { width:64px; height:64px; border-radius:50%; background:#fff; flex:none; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .logo-dau h1 { margin:0 !important; }
  .tvkm { display:block; text-decoration:none; background:#16402F; color:#fff; border-radius:18px; padding:16px 18px; }
  .tvkm .nhan2 { display:inline-block; background:#E2C46B; color:#16402F; font-weight:800; font-size:14px; letter-spacing:1px; border-radius:10px; padding:3px 10px; margin-bottom:8px; }
  .tvkm b { display:block; font-size:19px; color:#E2C46B; line-height:1.3; margin-bottom:4px; }
  .tvkm p { margin:0; font-size:16px; }
  .tvkm .nho { display:inline-block; margin-top:12px; background:#E2C46B; color:#16402F; font-weight:800; padding:8px 16px; border-radius:20px; font-size:16px; }
  .thetv .dauthe { display:flex; align-items:center; gap:12px; }
  .thetv .dauthe img { width:56px; height:56px; border-radius:50%; background:#fff; flex:none; }
  .thetv .tencs { font-size:13px; font-weight:800; color:#E2C46B; letter-spacing:.5px; margin:0; }
  .diemlon { text-align:center; }
  .diemlon h2 { text-align:center; }
  .diemlon .so { font-size:76px; font-weight:900; color:#16402F; line-height:1; margin:4px 0 8px; }
  .diemlon .thanh i { background:linear-gradient(90deg,#E2C46B,#C9A13F); }
  .moc { display:flex; justify-content:space-between; align-items:center; gap:10px; border:2px solid #E5DFCF; border-radius:14px; padding:12px 14px; margin:8px 0; text-align:left; }
  .moc b { color:#8A7A55; white-space:nowrap; font-size:16px; }
  .moc.du { border-color:#2E7D5B; background:var(--xanh-nhat); }
  .moc.du b { color:var(--xanh2); }
  .oluoi { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; padding:0; list-style:none; }
  .oluoi li { border-radius:12px; padding:8px 4px; text-align:center; background:#FAF8F2; border:2px solid #E5DFCF; font-size:15px; line-height:1.3; }
  .oluoi li b { display:block; font-size:18px; }
  .oluoi li.xong { background:#16402F; border-color:#16402F; color:#fff; }
  .oluoi li.xong b { color:#E2C46B; }
  .oluoi li.tang { grid-column:span 2; background:#FFF8E1; border:2px dashed #C9A13F; color:#16402F; }
  .ls li b { color:var(--xanh2); }
  footer { text-align:center; color:var(--phu); font-size:14px; padding:20px 16px 8px; }
</style>

function xoaLich(t) { ghiJSON('tt_lich', dsLich().filter(function (x) { return x.t !== t; })); veTrang(); }
function trangThongBao() {
  var s = thanhTren('Thông báo'), ds = dsLich();
  s += '<section class="the"><h2>Lịch hẹn của bạn</h2>';
  if (!ds.length) s += '<p>Bạn chưa có lịch hẹn nào đặt qua app.</p><a class="nut phu" href="#/datlich">Đặt lịch ngay</a>';
  ds.forEach(function (l) {
    s += '<div class="tb"><h3>' + l.dv + '</h3><p class="ngay">' + l.gio + ', ' + tenNgay(l) + '. Số người: ' + l.nguoi + '.</p>' +
      '<p>App ghi lại lịch này khi bạn gửi. Cơ sở sẽ nhắn hoặc gọi để xác nhận.</p>' +
      '<a class="nut phu nutnho" href="' + linkLich(l) + '">Thêm vào lịch điện thoại để được nhắc</a>' +
      '<a class="nut phu nutnho" href="tel:' + SDT + '">Đổi lịch: gọi ' + SDT_DOC + '</a>' +
      '<button class="nut phu nutnho" type="button" onclick="xoaLich(' + l.t + ')">Xóa lịch này khỏi app</button></div>';
  });
  s += '</section><section class="the" id="uudai" aria-live="polite">' + htmlUuDai() + '</section>';
  return s;
}
function htmlUuDai() {
  var ds = dsUuDai(), da = docJSON('tt_dadoc', []), s = '<h2>Ưu đãi</h2>';
  if (!ds.length) return s + '<p>Hiện chưa có ưu đãi mới. Cơ sở sẽ cập nhật ở đây.</p>';
  ds.forEach(function (u) {
    s += '<div class="tb"><h3>' + u.ten + (u.dangChay && da.indexOf(u.khoa) < 0 ? '<span class="moi">Mới</span>' : '') + '</h3><p class="ngay">' + (u.dangChay ? 'Đang diễn ra, đến hết ' + u.den : 'Sắp diễn ra, từ ' + u.tu + ' đến ' + u.den) + '</p><p>' + u.nd + '</p>' +
      (u.dangChay ? '<a class="nut chinh nutnho" href="#/datlich">Đặt lịch nhận ưu đãi</a>' : '') + '</div>';
  });
  return s;
}
function danhDauDaDoc() { var da = docJSON('tt_dadoc', []); dsUuDai().forEach(function (u) { if (u.dangChay && da.indexOf(u.khoa) < 0) da.push(u.khoa); }); ghiJSON('tt_dadoc', da.slice(-50)); }

/* ===== Điều hướng ===== */
function quayLai() { if (history.length > 1 && location.hash && location.hash !== '#/') history.back(); else location.hash = '#/'; }
function veTrang() {
  var duong = (location.hash || '#/').slice(2).split('/'), html, tab = 'trangchu', tieuDe = 'Bấm huyệt Thanh Tùng';
  if (duong[0] === 'dv' && timDV(duong[1])) { var d = timDV(duong[1]); html = trangDichVu(d); tab = ''; tieuDe = d.ten; }
  else if (duong[0] === 'datlich') { html = trangDatLich(duong[1]); tab = 'datlich'; tieuDe = 'Đặt lịch hẹn'; }
  else if (duong[0] === 'khuyenmai') { html = trangKhuyenMai(); tab = ''; tieuDe = 'Khuyến mãi'; }
  else if (duong[0] === 'thanhtoan') { html = trangThanhToan(); tab = 'thanhtoan'; tieuDe = 'Thanh toán'; }
  else if (duong[0] === 'taikhoan') { html = trangTaiKhoan(duong[1]); tab = 'taikhoan'; tieuDe = 'Tài khoản'; }
  else if (duong[0] === 'thongbao') { html = trangThongBao(); tab = ''; tieuDe = 'Thông báo'; }
  else if (duong[0] === 'huongdan') { html = trangHuongDan(); tab = ''; tieuDe = 'Hướng dẫn sử dụng'; }
  else if (duong[0] === 'nhanvien') { html = trangNhanVien(duong[1]); tab = 'taikhoan'; tieuDe = 'Màn hình nhân viên'; }
  else if (duong[0] === 'moidangky') { html = trangMoiDK(); tab = ''; tieuDe = 'Mời đăng ký thành viên'; }
  else if (duong[0] === 'lienhe') { html = trangLienHe(); tab = 'lienhe'; tieuDe = 'Liên hệ'; }
  else html = trangChu();
  document.getElementById('noidung').innerHTML = html;
  document.title = tieuDe;
  [].forEach.call(document.querySelectorAll('.tab'), function (t) { if (t.getAttribute('data-tab') === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  if (tab === 'datlich') ganDatLich();
  if (document.getElementById('phieu')) taiPhieu();
  if (document.getElementById('diem')) taiDiem();
  if (duong[0] === 'nhanvien') sauVeNhanVien(duong[1]);
  if (duong[0] === 'taikhoan' && docTV() && !duong[1]) kiemNV(function (q) { ['nutnv0'].forEach(function (i) { var c = document.getElementById(i); if (c) c.className = q ? 'ganday' : 'an'; }); });
  if (duong[0] === 'thongbao') { setTimeout(danhDauDaDoc, 1500); taiUuDai(function (ok) { var u = document.getElementById('uudai'); if (ok && u) u.innerHTML = htmlUuDai(); }); }
  window.scrollTo(0, 0);
  var h = document.getElementById('tieude'); if (h) h.focus();
}
function vuaChuTab() {
  var nhan = document.querySelectorAll('.tab .nhan'), co = 13;
  function tran() { for (var i = 0; i < nhan.length; i++) if (nhan[i].scrollWidth > nhan[i].clientWidth + 1) return true; return false; }
  for (var i = 0; i < nhan.length; i++) nhan[i].style.fontSize = '';
  while (tran() && co > 8) { co -= 0.5; for (var j = 0; j < nhan.length; j++) nhan[j].style.fontSize = co + 'px'; }
}
window.addEventListener('resize', vuaChuTab);
window.addEventListener('hashchange', veTrang);
setInterval(function () { var el = document.getElementById('trangthai'); if (el) el.outerHTML = trangThai(); }, 60000);
veTrang();
vuaChuTab();
taiUuDai(function (ok) { var c = document.querySelector('.chuong'); if (ok && c) c.outerHTML = nutChuong(); });
taiCauHinh();
setTimeout(vuaChuTab, 500);
</script>
